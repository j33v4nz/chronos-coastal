name: CHRONOS-COASTAL CI & Evals Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-evals:
    name: Backend Test Suite & Physics Calibration Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Test Suite (48 Tests & Evals)
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v --durations=10

      - name: Run Physics Calibration & Evaluation Benchmark
        env:
          PYTHONPATH: backend
        run: |
          python backend/app/evals/runner.py

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Cybernetic Production Bundle
        working-directory: frontend
        run: npm run build
