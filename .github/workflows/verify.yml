name: Verify prototype
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
          GEMINI_API_KEY: ''
          GEE_PROJECT_ID: ''
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:hosted
      - run: python scripts/check_engine_parity.py
